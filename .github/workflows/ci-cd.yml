name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Runs de PR são substituídos pelo push mais novo; runs do main nunca são
# cancelados, porque podem estar no meio de um deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: "Go: vet, build e testes"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: Testes do script de deploy
        run: .github/scripts/render-deploy.test.sh

      - name: Testes do guard do seed
        run: .github/scripts/seed-guard.test.sh

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t regioes-api:ci .

  deploy:
    name: Deploy no Render
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://regioes-hidrograficas-api.onrender.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy e teste de fumaça
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
          SMOKE_URL: https://regioes-hidrograficas-api.onrender.com/api/v1/basins
        run: .github/scripts/render-deploy.sh
