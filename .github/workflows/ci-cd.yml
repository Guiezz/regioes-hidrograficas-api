name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Runs de PR são substituídos pelo push mais novo; runs do main nunca são
# cancelados, porque podem estar no meio de um deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: "Go: vet, build e testes"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t regioes-api:ci .
