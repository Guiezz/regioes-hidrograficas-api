basePath: /api/v1
definitions:
  model.ActionMatrix:
    properties:
      acoes_especificas:
        type: string
      basin_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      instituicoes_envolvidas:
        type: string
      prioridade:
        type: string
      programa:
        type: string
      solicitacoes_cbh:
        type: string
      tipo_matriz:
        type: string
    type: object
  model.ConsolidatedStats:
    properties:
      basin_id:
        description: '<--- NOVO: Vincula à bacia (Salgado)'
        type: integer
      created_at:
        type: string
      id:
        type: integer
      iea_max:
        type: number
      iea_min:
        type: number
      indice_atual:
        type: number
      indice_global:
        type: number
      reference_month:
        type: string
      total_actions:
        type: integer
    type: object
  model.CustoVariavel:
    properties:
      descricao:
        type: string
      id:
        type: integer
      valorUnitario:
        type: number
    type: object
  model.EixoAcao:
    properties:
      eixo:
        description: Nome da coluna no banco
        type: string
      id:
        type: integer
      percentual:
        type: number
      periodos:
        items:
          $ref: '#/definitions/model.PeriodoAcao'
        type: array
      valorTotalProjetado:
        type: number
    type: object
  model.PeriodoAcao:
    properties:
      custoFixo:
        type: number
      custosVariaveis:
        items:
          $ref: '#/definitions/model.CustoVariavel'
        type: array
      id:
        type: integer
      intervalo:
        type: string
    type: object
  model.PlanoAcaoResponse:
    properties:
      planoAcao:
        items:
          $ref: '#/definitions/model.EixoAcao'
        type: array
      resumoGeral:
        $ref: '#/definitions/model.ResumoGeral'
    type: object
  model.ResumoGeral:
    properties:
      id:
        type: integer
      percentual:
        type: number
      valorTotalPrevisto:
        type: number
    type: object
  model.Section:
    properties:
      basin_id:
        description: Referência opcional à bacia (caso expanda para outras bacias
          no futuro)
        type: integer
      content:
        description: O texto longo
        type: string
      created_at:
        type: string
      id:
        type: integer
      image:
        type: string
      level:
        description: 1, 2, 3... (Nível hierárquico para o frontend indentar)
        type: integer
      number:
        description: 'Ex: "1", "1.1", "3.4.1"'
        type: string
      title:
        description: 'Ex: "Infraestrutura Hídrica"'
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: suporte@exemplo.com.br
    name: Suporte Técnico
  description: API para monitoramento, gestão e visualização dos Planos de Recursos
    Hídricos (Curu, Salgado, etc).
  termsOfService: http://swagger.io/terms/
  title: Regiões Hidrográficas API
  version: "1.0"
paths:
  /actions:
    get:
      description: Retorna lista de ações com filtros ajustados para a estrutura atual
        do banco.
      parameters:
      - description: ID da Bacia
        in: query
        name: basin_id
        type: integer
      - description: Filtro por nome do Eixo
        in: query
        name: eixo
        type: string
      - description: Filtro por Tipologia
        in: query
        name: tipologia
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Listar Ações (Matriz/Planos)
      tags:
      - Actions
  /actions/filters:
    get:
      description: Retorna listas corrigidas onde 'eixos' busca dados da tabela 'programas'.
      parameters:
      - description: ID da Bacia
        in: query
        name: basin_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Opções de Filtro
      tags:
      - Actions
  /content:
    get:
      description: Retorna os textos hierárquicos (1.1, 1.2...) para montar a página
        de leitura
      parameters:
      - description: ID da Bacia
        in: query
        name: basin_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Section'
            type: array
      summary: Textos do Plano
      tags:
      - Content
  /dashboard/consolidated:
    get:
      description: Retorna IEA Máximo, IEA Atual e Índice Global
      parameters:
      - description: 'ID da Bacia (Padrão: 1)'
        in: query
        name: basin_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ConsolidatedStats'
      summary: Dados Consolidados (Cards)
      tags:
      - Dashboard
  /dashboard/radar:
    get:
      description: Retorna soma dos pesos agrupados por tipologia (Obra, Estudo, etc)
      parameters:
      - description: 'ID da Bacia (Padrão: 1)'
        in: query
        name: basin_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: float64
              type: number
            type: object
      summary: Dados do Gráfico Radar
      tags:
      - Dashboard
  /financeiro/custos:
    get:
      consumes:
      - application/json
      description: Retorna o resumo geral e os custos por eixo de uma bacia específica
        via ID.
      parameters:
      - description: ID da Bacia Hidrográfica
        in: query
        name: basin_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PlanoAcaoResponse'
        "500":
          description: Erro interno ao buscar dados
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar custos de planejamento
      tags:
      - Financeiro
  /financeiro/matriz:
    get:
      consumes:
      - application/json
      description: Retorna a matriz de ações filtrada por bacia.
      parameters:
      - description: ID da Bacia Hidrográfica
        in: query
        name: basin_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.ActionMatrix'
            type: array
        "500":
          description: Erro interno ao buscar dados
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar matriz de ações e prioridades
      tags:
      - Financeiro
swagger: "2.0"
